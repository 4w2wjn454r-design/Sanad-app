<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sanad | Your Health, Always With You</title><style>:root{--teal:#087e88;--aqua:#19b6bf;--ink:#132e3a;--muted:#6c8790;--bg:#f3fafb}*{box-sizing:border-box}body{margin:0;background:#dceff1;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}#app{max-width:480px;min-height:100dvh;margin:auto;background:var(--bg);padding:22px 18px 98px;box-shadow:0 0 30px #14505a14}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:28px;font-weight:850;color:#087e88;letter-spacing:-1px}.brand em{font-style:normal;color:#19b6bf}.pill{font-size:11px;color:#087e88;background:#d9f4f5;padding:7px 10px;border-radius:20px;font-weight:750}h1{font-size:25px;letter-spacing:-.6px;margin:23px 0 7px}h2{font-size:18px;margin:22px 0 12px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.hero{background:linear-gradient(125deg,#076e7b,#1bb5be);border-radius:22px;color:white;padding:22px;margin:20px 0;box-shadow:0 10px 25px #0b919326}.hero small{opacity:.8;font-weight:700;letter-spacing:1px}.hero h2{font-size:24px;margin:14px 0 9px}.hero p{font-size:13px;margin:6px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{border:1px solid #e2edef;background:white;border-radius:16px;padding:20px 8px;font-size:13px;font-weight:700;color:var(--ink);min-height:105px;box-shadow:0 4px 14px #113c4508}.tile span{display:block;font-size:27px;margin-bottom:10px}.card{background:white;border:1px solid #e0eef0;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 12px #12313e08}.item{display:flex;align-items:center;justify-content:space-between;text-align:left;gap:12px;width:100%;padding:15px 0;background:none;border:0;border-bottom:1px solid #eaf1f2;color:var(--ink)}.item:last-child{border-bottom:0}.item strong{display:block;font-size:14px}.item small{display:block;color:var(--muted);margin-top:5px}.back{border:0;background:none;color:var(--teal);font-weight:700;padding:10px 0}.primary{width:100%;border:0;border-radius:12px;padding:14px 12px;background:var(--teal);color:white;font-weight:750;margin-top:10px}.secondary{width:100%;border:1px solid #b9e4e6;border-radius:12px;padding:13px;background:#e9f8f8;color:var(--teal);font-weight:700;margin-top:10px}.tag{display:inline-block;color:#177b52;background:#e1f7e9;padding:6px 10px;border-radius:30px;font-size:11px;font-weight:700}.warning{background:#fff4db;border:1px solid #f8e4b2;padding:16px;border-radius:14px;color:#795b1a;line-height:1.5;font-size:13px;margin:15px 0}.center{text-align:center}.globe{font-size:70px;margin:12px}.field{width:100%;border:1px solid #cde2e5;border-radius:11px;padding:13px;font-size:15px;margin:9px 0}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;display:flex;justify-content:space-around;background:white;border-top:1px solid #dbe9eb;padding:11px 2px calc(10px + env(safe-area-inset-bottom))}nav button{background:none;border:0;color:#537b83;font-size:11px;min-width:55px}nav button b{display:block;font-size:21px;margin-bottom:4px;color:var(--teal)}.notice{font-size:11px;color:#729097;margin-top:14px}.qr{margin:18px auto;width:185px;height:185px;display:grid;grid-template-columns:repeat(21,1fr);gap:1px;padding:8px;background:white;border:1px solid #d5e8e9}.qr i{background:white}.qr i.on{background:#103c43}@media(min-width:600px){#app{margin:25px auto;min-height:calc(100dvh - 50px);border-radius:25px}nav{bottom:0}}</style></head><body><main id="app"></main><script>
'use strict';let name=localStorage.getItem('sanadDemoName')||'Nora Al Rayashi';let page=localStorage.getItem('sanadDemoName')?'home':'welcome';let orders=[];let granted=false;const tests=[{name:'Complete Blood Count (CBC)',date:'15 Oct 2026',status:'Within Normal Range',details:'WBC 7.2 ×10⁹/L · Hb 13.5 g/dL · Platelets 280 ×10⁹/L'},{name:'Vitamin D Test',date:'10 Sep 2026',status:'Result Available',details:'Demo report — sample values only'},{name:'Blood Glucose',date:'12 Aug 2026',status:'Within Normal Range',details:'Demo report — sample values only'}];const app=document.getElementById('app');const btn=(title,dest,emoji)=>`<button class="tile" data-page="${dest}"><span>${emoji}</span>${title}</button>`;const back=(title)=>`<button class="back" data-page="home">← Back to Home</button><h1>${title}</h1>`;const card=(text)=>`<div class="card">${text}</div>`;const row=(label,dest,sub='Tap to view')=>`<button class="item" data-page="${dest}"><span><strong>${label}</strong><small>${sub}</small></span><span>›</span></button>`;function qr(){let x='<div class="qr" aria-label="Decorative QR illustration, not scannable">';for(let y=0;y<21;y++)for(let z=0;z<21;z++){const finder=(a,b)=>{let u=z-a,v=y-b;if(u<0||v<0||u>6||v>6)return null;return u===0||v===0||u===6||v===6||(u>=2&&u<=4&&v>=2&&v<=4)};let f=finder(0,0);if(f===null)f=finder(14,0);if(f===null)f=finder(0,14);let on=f===null?((y*37+z*17+y*z*7)%13<6):f;x+=`<i class="${on?'on':''}"></i>`}return x+'</div>'}function labs(){return [...orders,...tests].map((t,i)=>card(`<strong>🧪 ${t.name.replaceAll('<','&lt;')}</strong><p class="muted">${t.date} · ${i<orders.length?'Demo test order':'Demo Hospital'}</p><span class="tag">${t.status}</span><button class="secondary" data-report="${i}">View Details</button>`)).join('')}function render(){let content='';switch(page){case 'welcome':content=`<div class="top"><div class="brand">✚ San<em>ad</em></div><span class="pill">DEMO VERSION</span></div><h1>Welcome to Sanad 🩵</h1><p class="muted">Enter your name to create your sample medical passport.</p><div class="card"><label for="studentName">Your name</label><input class="field" id="studentName" placeholder="e.g. Nora Al Rayashi" maxlength="60"><button class="primary" data-action="setname">Start My Demo</button></div><p class="notice">Use a name only. Do not enter real medical information.</p>`;break;case 'home':content=`<div class="top"><div class="brand">✚ San<em>ad</em></div><span class="pill">DEMO VERSION</span></div><h1>Welcome, ${name.split(" ")[0].replaceAll("<","&lt;")}! 👋</h1><p class="muted">Your health information, all in one place.</p><div class="hero"><small>SANAD MEDICAL ID</small><h2>${name}</h2><p>Sanad ID: SND-784321</p><p>Blood Type: O+</p></div><button class="secondary" data-page="welcome">Change Student Name</button><h2>My Health</h2><div class="grid">${btn('Medical Records','records','📋')}${btn('Lab Results','labs','🧪')}${btn('Prescriptions','meds','💊')}${btn('Share Records','share','🔗')}${btn('Health Passport','passport','🌍')}${btn('Doctor Portal','doctor','🩺')}</div><h2>Recent Medical Activity</h2>${card('<strong>🧪 Complete Blood Count</strong><p class="muted">15 Oct 2026 · Demo Hospital</p><span class="tag">Results Available</span>')}`;break;case 'records':content=back('Medical Records')+card([['Medical History','history'],['Laboratory Results','labs'],['Medical Imaging','imaging'],['Medications','meds'],['Allergies','allergies'],['Vaccinations','vaccines'],['Surgeries','surgeries'],['Hospital Visits','visits']].map(x=>row(...x)).join(''));break;case 'labs':content=back('Laboratory Results')+'<p class="muted">Review previous results to help avoid repeated tests.</p>'+labs();break;case 'history':content=back('Medical History')+card('<strong>Patient Summary</strong><p>No chronic conditions listed in this fictional demo profile.</p>');break;case 'meds':content=back('Medications')+card('<strong>Prescriptions</strong><p>There are no active prescriptions in this sample profile.</p>');break;case 'allergies':content=back('Allergies')+card('<strong>Allergy Information</strong><p>No known allergies recorded in this fictional profile.</p>');break;case 'imaging':content=back('Medical Imaging')+card('No imaging reports uploaded in this demo.');break;case 'vaccines':content=back('Vaccinations')+card('Vaccination record: demonstration only.');break;case 'surgeries':content=back('Surgeries')+card('No previous surgeries recorded in this fictional profile.');break;case 'visits':content=back('Hospital Visits')+card('<strong>Demo Hospital</strong><p>15 Oct 2026 — Laboratory appointment</p>');break;case 'share':content=back('Share Your Records')+card(`<div class="center"><h2>Secure Record Sharing</h2><p class="muted">Demonstration of patient-controlled access.</p>${qr()}<p class="muted">Illustrative QR pattern — not scannable</p><button class="primary" data-action="grant">${granted?'Demo Access Granted ✓':'Grant Demo Access (24 Hours)'}</button><p class="notice">No real medical data is shared.</p></div>`);break;case 'passport':content=back('Your Health Passport')+`<div class="hero center"><div class="globe">🌍✈️</div><h2>Travel with confidence</h2><p>Your health history travels with you.</p></div>`+card(row('Digital Health Passport','passport-summary','Patient information')+row('International Sharing','share','Demo sharing')+row('Emergency Summary','passport-summary','Medical overview')+row('Document Translation','translation','Demo feature'));break;case 'passport-summary':content=back('Health Passport Summary')+card(`<h2>${name}</h2><p>Patient ID: SND-784321</p><p>Blood type: O+</p><p>Allergies: None recorded (demo)</p><p class="notice">Fictional medical information</p>`);break;case 'translation':content=back('Translation')+card('Translation is a planned feature of Sanad. This demonstration does not connect to a translation service.');break;case 'doctor':content=back('Doctor Portal')+card(`<strong>🩺 Sanad — Doctor Portal</strong><p class="muted">Fictional patient · No hospital connection</p><h2>${name}</h2><p>Patient ID: SND-784321</p><span class="tag">Sample Patient</span>`)+`<div class="warning">⚠️ Similar test found in patient history. Review the previous result before ordering another test.</div><button class="primary" data-page="doctorlabs">Review Previous Test</button><button class="secondary" data-page="order">Order New Test</button><h2>Patient Records</h2><div class="grid">${btn('Medical History','history','📋')}${btn('Lab Results','doctorlabs','🧪')}${btn('Medications','meds','💊')}${btn('Allergies','allergies','🩹')}</div>`;break;case 'doctorlabs':content=back('Doctor: Lab Results')+labs();break;case 'order':content=back('Order New Test')+card('<p class="muted">Add a fictional test order for the presentation.</p><input id="testName" class="field" placeholder="e.g. Blood Glucose"><button class="primary" data-action="order">Add Demo Test Order</button>');break;default:content=back('Sanad')}
app.innerHTML=content+`<p class="notice">Sanad classroom prototype · All patient information is fictional.</p>${page==='welcome'?'':'<nav>'}${page==='welcome'?'':[['⌂','Home','home'],['▤','Records','records'],['⇧','Share','share'],['◎','Passport','passport'],['✚','Doctor','doctor']].map(x=>`<button data-page="${x[2]}"><b>${x[0]}</b>${x[1]}</button>`).join('')+(page==='welcome'?'':'</nav>')}`;window.scrollTo(0,0)}app.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.page){page=target.dataset.page;render()}else if(target.dataset.action==='setname'){const v=document.getElementById('studentName').value.trim();if(!v){alert('Please enter your name');return}name=v.replaceAll('<','&lt;').replaceAll('>','&gt;');localStorage.setItem('sanadDemoName',name);orders=[];granted=false;page='home';render()}else if(target.dataset.report!==undefined){const t=[...orders,...tests][Number(target.dataset.report)];alert(t.name+'\n'+t.date+'\n'+(t.details||'New demo order — results pending'))}else if(target.dataset.action==='grant'){granted=true;render();alert('Demo access granted for 24 hours. No actual records have been shared.')}else if(target.dataset.action==='order'){let input=document.getElementById('testName');let value=input.value.trim();if(!value){alert('Please enter a test name.');return}orders.unshift({name:value,date:'New demo order',status:'Ordered'});page='doctorlabs';render();alert('Demo test order added!')}});render();</script></body></html>
